name: HEATWISE v0.3.2 - Real Sepolia FULL/MASK3 scientific preflight

on:
  workflow_dispatch:
    inputs:
      full_band_search:
        description: 'Run all 500000 band combinations (otherwise 2000 for a fast initial test)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  sepolia-full:
    name: Real Sepolia FULL and MASK3 selection
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      N_COMBINATIONS: ${{ inputs.full_band_search && '500000' || '2000' }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock-python311.txt

      - name: Verify genuine Sepolia inputs and previous FULL reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import rasterio

          raster = Path('examples/sepolia/Sepolia_CHIME_Thermopolis_v2_COG.tif')
          gusl = Path('examples/resources/GUSL_spectra_by_material_headers.xlsx')
          previous = Path('examples/output_sepolia/Endmembers_FULL.xlsx')
          for path in (raster, gusl, previous):
              if not path.is_file():
                  raise FileNotFoundError(path)
              print(f'[INPUT] {path}: {path.stat().st_size:,} bytes')
          with rasterio.open(raster) as src:
              print(f'[SCENE] {src.count} bands, {src.width} x {src.height} pixels, {src.crs}')
              if src.count != 250:
                  raise AssertionError(f'Expected Sepolia v2 with 250 bands; found {src.count}')
              first = src.tags(1).get('wavelength_um')
              if first is None:
                  raise AssertionError('Expected wavelength_um in image band metadata')
          sheets = pd.ExcelFile(gusl).sheet_names
          print('[GUSL] Sheets:', sheets)
          for sheet in ('BRUSSELS_APEX_GENLIB', 'DLR'):
              if sheet not in sheets:
                  raise AssertionError(f'Missing required GUSL sheet: {sheet}')
          reference = pd.read_excel(previous)
          print('[HISTORICAL FULL] Rows:', len(reference), 'Endmembers:', list(reference.columns[1:]))
          PY

      - name: Run v0.3.2 on real Sepolia (general fallback, dual FULL/MASK3, no FCLS)
        shell: bash
        run: |
          python class_guided_processor.py \
            --input-catalog examples/sepolia \
            --gusl examples/resources/GUSL_spectra_by_material_headers.xlsx \
            --config examples/config_sepolia_report.json \
            --n-random-combinations "$N_COMBINATIONS" \
            --output-dir results/sepolia_full

      - name: Validate BOTH full-length endmember products and STAC
        run: python tools/validate_outputs.py results/sepolia_full

      - name: Audit FULL primary/fallback endmembers and official-FCLS spectral handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          import rasterio

          output = Path('results/sepolia_full')
          summary = json.loads((output / 'run_summary.json').read_text())
          selected = json.loads((output / 'selected_bands.json').read_text())
          current = pd.read_excel(output / 'selected_endmembers.xlsx')
          reference = pd.read_excel('examples/output_sepolia/Endmembers_FULL.xlsx')

          assert summary['version'] == '0.3.2'
          assert summary['endmember_selection'] == 'FULL+MASK3'
          assert len(pd.read_excel(output / 'selected_endmembers_MASK3.xlsx')) == len(current)
          assert summary['mask3_metric_bands'] == 15
          assert summary['mask3_selection_does_not_truncate_endmembers'] is True
          assert summary['mask3_reselection'] is True
          assert summary['unmixing_executed'] is False
          assert summary['input_band_count'] == 250
          assert summary['selected_bands'] == 15
          assert len(selected['wavelengths_um']) == 15

          # Generic fallback can add previously missing classes, so demanding
          # exact column parity with the old 0.2.0 run is scientifically wrong.
          # Audit the primary signatures separately; a changed historical
          # class set is *recorded* rather than silently treated as success.
          report_path = output / 'diagnostics' / 'FULL_fallback_report.json'
          fallback = json.loads(report_path.read_text())
          added = {entry['class_name'] for entry in fallback['selected']}
          assert added == set(summary['fallback_selected_classes'])
          assert fallback['mode'] == 'FULL'
          assert all(entry['quality_flag'].startswith('PROVISIONAL') for entry in fallback['selected'])
          original_columns = list(reference.columns[1:])
          new_columns = list(current.columns[1:])
          print('[FULL] Historical endmembers:', original_columns)
          print('[FULL] Current endmembers:', new_columns)
          print('[FULL] Newly recovered provisional classes:', sorted(added))
          print('[FULL] Unresolved classes:', summary['fallback_unresolved_classes'])
          if len(set(new_columns)) != len(new_columns):
              raise AssertionError('Duplicate endmember column names')
          # Every fallback spectrum must correspond exactly to a candidate
          # extracted from THIS scene, not to a GUSL library template.
          with np.load(output / 'diagnostics' / 'candidates.npz') as candidate_npz:
              candidates = candidate_npz['spectra']
          for entry in fallback['selected']:
              candidate_idx = int(entry['candidate'].split('_')[1]) - 1
              col = entry['class_name']
              if col not in current.columns:
                  col = f'{col}_1'  # Replicated-class naming convention
              if col not in current.columns:
                  raise AssertionError(f'Fallback class missing from endmember table: {col}')
              np.testing.assert_allclose(
                  current[col].to_numpy(dtype=float), candidates[candidate_idx],
                  rtol=0, atol=1e-6,
                  err_msg=f'Fallback {col} is not the reported real scene candidate',
              )
          common_primary = [
              c for c in original_columns if c in current.columns and c not in added
          ]
          max_difference = None
          if common_primary:
              differences = np.abs(
                  current[common_primary].to_numpy(dtype=float)
                  - reference[common_primary].to_numpy(dtype=float)
              )
              max_difference = float(np.max(differences))
              print('[HISTORICAL COMPARISON] Max abs reflectance difference for '
                    'shared primary signatures:', max_difference)
              if max_difference > 1e-5:
                  print('::warning::Shared FULL endmembers differ numerically '
                        'from historical v0.2.0; inspect provenance and environment.')
          historical_missing = sorted(set(original_columns) - set(new_columns))
          if historical_missing:
              print('::warning::Historical endmembers not reproduced:', historical_missing)
          print('[SUMMARY] Image bands:', summary['input_band_count'])
          print('[SUMMARY] Usable/exported endmember bands:', summary['endmember_spectral_bands'])
          print('[SUMMARY] GUSL FULL comparison bands:', summary['full_metric_bands'])
          print('[SUMMARY] Independent selected band wavelengths (um):', selected['wavelengths_um'])

          # Reproduce only the spectral-band alignment rules used by the official
          # ESA-Heatwise FCLS processor, not an FCLS abundance calculation.
          with rasterio.open('examples/sepolia/Sepolia_CHIME_Thermopolis_v2_COG.tif') as src:
              raw = src.read().astype(np.float32)
              image_wl = np.asarray([
                  float(src.tags(b)['wavelength_um'])
                  for b in range(1, src.count + 1)
              ])
              if src.nodata is not None:
                  raw[raw == src.nodata] = np.nan
              scales = np.asarray(src.scales, dtype=float)
              offsets = np.asarray(src.offsets, dtype=float)
              if not np.allclose(scales, 1) or not np.allclose(offsets, 0):
                  print('::warning::Source TIFF scale/offset is not identity. '
                        'Class-guided applies these metadata but official FCLS '
                        'requires an explicit radiometric-scale assessment.')

          signature_wl = current['wavelength_um'].to_numpy(dtype=float)
          signatures = current.iloc[:, 1:].to_numpy(dtype=float)
          e_interp = np.column_stack([
              np.interp(image_wl, signature_wl, signatures[:, j], left=np.nan, right=np.nan)
              for j in range(signatures.shape[1])
          ])
          fcls_band_mask = (
              np.isfinite(raw).any(axis=(1, 2))
              & np.isfinite(e_interp).all(axis=1)
          )
          n_fcls_bands = int(fcls_band_mask.sum())
          print('[FCLS PREFLIGHT] Spectral bands retained by FCLS rules:', n_fcls_bands)
          if n_fcls_bands < 2:
              raise AssertionError('Too few bands for official FCLS spectral alignment')
          pixels_ok = int(np.all(np.isfinite(raw[fcls_band_mask]), axis=0).sum())
          print('[FCLS PREFLIGHT] Finite pixels under FCLS band mask:', pixels_ok)
          if pixels_ok == 0:
              raise AssertionError('No valid pixels after official FCLS spectral-band selection')

          effective = json.loads((output / 'effective_config.json').read_text())
          gap_mask = np.zeros(len(image_wl), dtype=bool)
          for low, high in effective['extraction']['GAPS_UM']:
              gap_mask |= (image_wl >= low) & (image_wl <= high)
          n_gap_used = int((fcls_band_mask & gap_mask).sum())
          print('[FCLS PREFLIGHT] Bands in declared exclusion gaps that FCLS would use:', n_gap_used)
          if n_gap_used:
              print('::warning::Official FCLS would reintroduce some excluded gaps '
                    'by interpolating across internal wavelength intervals. '
                    'This scientific mismatch must be resolved before ESA delivery.')
          report = {
              'source': 'Real Sepolia CHIME-like v2 and uploaded GUSL XLSX',
              'processor_version': summary['version'],
              'image_bands': summary['input_band_count'],
              'usable_endmember_bands': summary['endmember_spectral_bands'],
              'full_comparison_bands': summary['full_metric_bands'],
              'mask3_comparison_bands': summary['mask3_metric_bands'],
              'mask3_endmembers': summary['endmembers_by_mode']['MASK3'],
              'endmembers': summary['final_endmembers'],
              'independent_selected_band_count': summary['selected_bands'],
              'historical_primary_max_abs_reflectance_difference': max_difference,
              'historical_missing_names': historical_missing,
              'fallback_selected_classes': sorted(added),
              'fallback_unresolved_classes': summary['fallback_unresolved_classes'],
              'fallback_requiring_independent_validation': True,
              'fcls_spectral_preflight_bands': n_fcls_bands,
              'fcls_spectral_preflight_finite_pixels': pixels_ok,
              'excluded_gap_bands_potentially_reintroduced_by_fcls': n_gap_used,
              'fcls_executed': False,
              'accuracy_validated': False,
          }
          Path('results/sepolia_fcls_preflight.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Upload results for review (even if a check fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepolia-v032-dual-real-${{ github.run_id }}
          path: |
            results/sepolia_full/
            results/sepolia_fcls_preflight.json
          if-no-files-found: warn
          retention-days: 14
