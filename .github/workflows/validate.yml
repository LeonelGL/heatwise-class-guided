name: Validate FULL + MASK3 class-guided processor and EOAP
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock-python311.txt
      - name: Scientific regression and FULL/MASK3 dual-mode integration tests
        run: python -m pytest tests -q
      - name: Validate container CWL
        run: python -m cwltool --validate cwl/workflow.cwl
      - name: Validate local CWL
        run: python -m cwltool --validate cwl/local/workflow.cwl
      - name: Build FULL/MASK3 dual-mode container
        run: docker build -t heatwise/class-guided:0.3.2 .
      - name: Run containerized CWL on synthetic STAC input
        run: python -m cwltool --outdir results/ci cwl/workflow.cwl examples/job_synthetic.yml
      - name: Validate dual-mode endmembers, optimized bands and STAC
        run: python tools/validate_outputs.py results/ci/results
